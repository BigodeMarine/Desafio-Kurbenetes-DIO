apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
    - {name: mysql, port: 3306, targetPort: mysql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  # PVC permanece mesmo se o StatefulSet for excluído ou reduzido.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mysql
          image: dio-mysql:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: mysql, containerPort: 3306}
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-secrets, key: MYSQL_PASSWORD}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-secrets, key: MYSQL_ROOT_PASSWORD}
          # O entrypoint oficial inicia como root para ajustar o volume e
          # abandona privilégios ao executar mysqld como mysql.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            exec: {command: [app-healthcheck]}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [app-healthcheck]}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            # ping verifica o servidor, sem reiniciar por erro de senha/schema.
            exec: {command: [mysqladmin, ping, -h, "127.0.0.1", --silent]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
