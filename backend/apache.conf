<VirtualHost *:8080>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
        AllowOverride None
        FallbackResource /index.php
    </Directory>
    <Files "conexao.php">
        Require all denied
    </Files>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
ServerName localhost
ServerTokens Prod
ServerSignature Off
