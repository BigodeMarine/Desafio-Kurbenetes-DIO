server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health/live { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location /api/ {
        # Sem sufixo na URL: preserva /api/mensagens para o roteador PHP.
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /api-unavailable;
    }
    location = /api-unavailable {
        internal;
        default_type application/json;
        return 503 '{"message":"Serviço indisponível. Tente novamente mais tarde."}';
    }
    location / { try_files $uri $uri/ =404; }
}
