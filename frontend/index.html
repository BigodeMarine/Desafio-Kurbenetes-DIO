<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css.css">
  <script src="/js.js" defer></script>
  <title>Envie sua mensagem</title>
</head>
<body>
  <main id="form-div">
    <h1>Envie sua mensagem</h1>
    <p>Preencha os campos abaixo para deixar seu comentário.</p>
    <form id="contact" action="/api/mensagens" method="post">
      <label for="name">Nome</label>
      <input id="name" name="nome" autocomplete="name" required maxlength="100">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">
      <label for="comment">Comentário</label>
      <textarea id="comment" name="comentario" rows="6" required maxlength="1000" aria-describedby="comment-help"></textarea>
      <small id="comment-help">Até 1000 caracteres. Todos os campos são obrigatórios.</small>
      <button type="submit" id="button-blue">Enviar</button>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
  </main>
</body>
</html>
